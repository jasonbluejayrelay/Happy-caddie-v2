name: Build Harvestline APK (Unity)

# Manual only — Unity builds are slow and need a licence secret (see harvestline/BUILD.md).
on:
  workflow_dispatch:

concurrency:
  group: harvestline-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # The simulation core lives once under harvestline/src and is compiled as a
      # standalone .NET library there; copy its sources into the Unity project so the
      # Harvestline.Core assembly definition has something to compile (see
      # harvestline/unity/Assets/Scripts/Harvestline.Core/PLACE_CORE_SOURCES_HERE.md).
      - name: Sync Core sources into the Unity project
        run: |
          rsync -am \
            --include='*/' --include='*.cs' --exclude='*' \
            harvestline/src/Harvestline.Core/ \
            harvestline/unity/Assets/Scripts/Harvestline.Core/
          echo "Synced Core sources:"
          find harvestline/unity/Assets/Scripts/Harvestline.Core -name '*.cs' | wc -l

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: harvestline/unity/Library
          key: Library-Harvestline-Android-${{ hashFiles('harvestline/unity/Assets/**', 'harvestline/unity/Packages/**', 'harvestline/src/Harvestline.Core/**') }}
          restore-keys: |
            Library-Harvestline-Android-
            Library-Harvestline-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: harvestline/unity
          unityVersion: 2022.3.40f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Harvestline
          buildMethod: Harvestline.Editor.HarvestlineBuild.PerformAndroidBuild

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Harvestline-APK
          path: |
            harvestline/unity/build/**/*.apk
            build/**/*.apk
          if-no-files-found: warn
